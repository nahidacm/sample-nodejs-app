# =========================================================================
# 1) THE TEMPLATE ITSELF
#    Save this as its own file in your git repo, e.g.:
#      .harness/templates/build_and_deploy_template.yaml
#    Then import/create it in Harness via Templates > "Start from Git" /
#    "Import Template", pointing at this file (Git Experience).
# =========================================================================
template:
  name: Build and Deploy Template
  identifier: build_and_deploy_template
  versionLabel: v1
  type: Pipeline
  orgIdentifier: myorg
  projectIdentifier: myproject
  tags: {}
  spec:
    stages:
      - stage:
          name: Build
          identifier: Build
          type: CI
          spec:
            cloneCodebase: true
            platform:
              os: Linux
              arch: Amd64
            runtime:
              type: Cloud
              spec: {}
            execution:
              steps:
                - step:
                    type: Run
                    name: Build
                    identifier: Build_Step
                    spec:
                      shell: Sh
                      command: |-
                        echo "Building <+pipeline.variables.serviceName>"
      - stage:
          name: Deploy
          identifier: Deploy
          type: Deployment
          spec:
            deploymentType: Kubernetes
            service:
              serviceRef: <+input>
            environment:
              environmentRef: <+input>
              infrastructureDefinitions:
                - identifier: <+input>
            execution:
              steps:
                - step:
                    name: Rollout Deployment
                    identifier: rolloutDeployment
                    type: K8sRollingDeploy
                    timeout: 10m
                    spec:
                      skipDryRun: false
                      pruningEnabled: false
              rollbackSteps:
                - step:
                    name: Rollback Rollout Deployment
                    identifier: rollbackRolloutDeployment
                    type: K8sRollingRollback
                    timeout: 10m
                    spec: {}
    variables:
      - name: serviceName
        type: String
        default: my-service
        description: Name of the service being built/deployed

---
# =========================================================================
# 2) A PIPELINE THAT CONSUMES THE TEMPLATE
#    This lives in your normal pipeline YAML (e.g. .harness/pipeline.yaml).
#    templateInputs mirrors whatever <+input> / variables the template
#    exposes — Harness will prompt for these in the UI too.
# =========================================================================
pipeline:
  name: Payments Service Pipeline
  identifier: Payments_Service_Pipeline
  orgIdentifier: myorg
  projectIdentifier: myproject
  template:
    templateRef: build_and_deploy_template
    versionLabel: v1
    templateInputs:
      type: Pipeline
      variables:
        - name: serviceName
          type: String
          value: payments-service
      stages:
        - stage:
            identifier: Deploy
            type: Deployment
            spec:
              service:
                serviceRef: payments_service
              environment:
                environmentRef: staging
                infrastructureDefinitions:
                  - identifier: staging_k8s_infra
